name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, matching local development: the lockfile is written by npm 11,
          # and npm 10 on Node 22 rejects it as out of sync with package.json.
          node-version: 24
          cache: npm

      # npm ci, so the runner installs exactly what the lockfile pins. It was
      # npm install for a while: the lock is written on macOS, where npm omits
      # @emnapi/core and @emnapi/wasi-threads from @napi-rs/wasm-runtime's
      # entry because that optional path is never resolved there — and npm ci
      # on Linux then refuses the tree. The lock is now repaired inside a
      # node:24 container (see docs in the bead), so both platforms resolve.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The lockfile is written on macOS, where npm resolves no wasm path for
      # @napi-rs/wasm-runtime and so drops @emnapi/core and
      # @emnapi/wasi-threads from its entry — which is exactly what broke
      # npm ci on this runner before. Running `npm install --package-lock-only`
      # on macOS strips them again, so any lock regenerated there arrives here
      # incomplete and silent.
      #
      # Regenerating on Linux is a no-op against a correct lock (verified
      # byte-identical), so a plain diff is a sound check. If it fails, repair
      # the lock in a container rather than by hand:
      #
      #   docker run --rm -v "$PWD":/w -w /w node:24 \
      #     npm install --package-lock-only --no-audit --no-fund
      #
      # seeded with BOTH package.json and the existing package-lock.json —
      # package.json alone re-resolves everything and bumps ~100 versions.
      - name: Lockfile is complete for Linux
        run: |
          cp package-lock.json /tmp/lock.before
          npm install --package-lock-only --no-audit --no-fund
          if ! diff -q /tmp/lock.before package-lock.json; then
            echo "::error::package-lock.json is incomplete on Linux. See the comment above this step."
            diff /tmp/lock.before package-lock.json | head -40
            exit 1
          fi
          git checkout -- package-lock.json

      # Runs astro sync first: .astro/types.d.ts declares astro:content,
      # import.meta.glob and the CSS module shims, and a fresh checkout has to
      # generate it before tsc sees them.
      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build site
        run: npx astro build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The suite talks to a preview server on 4322 (see playwright.config.ts),
      # which nothing else starts. --background daemonises it so the step ends.
      - name: Start preview server
        run: npx astro preview --port 4322 --background

      - name: Run E2E tests (excluding visual regression)
        run: npx playwright test --ignore-snapshots e2e/cipra-loops.spec.ts e2e/navigation.spec.ts e2e/nessies.spec.ts e2e/theme.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
