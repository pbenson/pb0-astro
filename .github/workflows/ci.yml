name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, matching local development: the lockfile is written by npm 11,
          # and npm 10 on Node 22 rejects it as out of sync with package.json.
          node-version: 24
          cache: npm

      # npm install, not npm ci: the lockfile records the platform-optional
      # native bindings resolved on macOS, and npm ci refuses to reconcile the
      # Linux set on the runner. See the bead on regenerating the lock in a
      # Linux container, which is what would let ci come back.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build site
        run: npx astro build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The suite talks to a preview server on 4322 (see playwright.config.ts),
      # which nothing else starts. --background daemonises it so the step ends.
      - name: Start preview server
        run: npx astro preview --port 4322 --background

      - name: Run E2E tests (excluding visual regression)
        run: npx playwright test --ignore-snapshots e2e/cipra-loops.spec.ts e2e/navigation.spec.ts e2e/nessies.spec.ts e2e/theme.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
