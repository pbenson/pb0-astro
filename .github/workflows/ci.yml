name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, matching local development: the lockfile is written by npm 11,
          # and npm 10 on Node 22 rejects it as out of sync with package.json.
          node-version: 24
          cache: npm

      # npm ci, so the runner installs exactly what the lockfile pins. It was
      # npm install for a while: the lock is written on macOS, where npm omits
      # @emnapi/core and @emnapi/wasi-threads from @napi-rs/wasm-runtime's
      # entry because that optional path is never resolved there — and npm ci
      # on Linux then refuses the tree. The lock is now repaired inside a
      # node:24 container (see docs in the bead), so both platforms resolve.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Runs astro sync first: .astro/types.d.ts declares astro:content,
      # import.meta.glob and the CSS module shims, and a fresh checkout has to
      # generate it before tsc sees them.
      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build site
        run: npx astro build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The suite talks to a preview server on 4322 (see playwright.config.ts),
      # which nothing else starts. --background daemonises it so the step ends.
      - name: Start preview server
        run: npx astro preview --port 4322 --background

      - name: Run E2E tests (excluding visual regression)
        run: npx playwright test --ignore-snapshots e2e/cipra-loops.spec.ts e2e/navigation.spec.ts e2e/nessies.spec.ts e2e/theme.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
